<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Result Store</title>
  <style>
    :root{color-scheme:light dark;font:14px system-ui,sans-serif;background:var(--color-background-primary,Canvas);color:var(--color-text-primary,CanvasText)}
    *{box-sizing:border-box}body{margin:0;padding:18px}h1{font-size:20px;margin:0}h2{font-size:15px;margin:0 0 10px}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}header p{margin:3px 0;color:var(--color-text-secondary,GrayText)}
    button,input,select,textarea{font:inherit;color:inherit;background:var(--color-background-primary,Canvas);border:1px solid var(--color-border-secondary,#aaa6);border-radius:7px;padding:7px 10px}button{cursor:pointer}button:disabled{cursor:default;opacity:.45}button:hover:enabled{background:var(--color-background-secondary,#8881)}input{min-width:0;width:100%}textarea{width:100%;resize:vertical}label{display:grid;gap:6px}select{max-width:100%}
    .columns{display:grid;grid-template-columns:260px minmax(0,1fr);gap:20px}.sidebar{display:grid;align-content:start;gap:16px}.filter{display:grid;grid-template-columns:80px 1fr;gap:6px;margin-top:9px}.filter>label{grid-column:1/-1;font-size:12px}.filter .range{grid-column:2}.panel{min-width:0;border:1px solid var(--color-border-secondary,#aaa4);border-radius:10px;padding:14px;margin-bottom:14px}.table-wrap{overflow:auto;max-height:230px}table{border-collapse:collapse;width:100%;font-size:12px}th,td{text-align:left;border-bottom:1px solid #8883;padding:7px;white-space:nowrap}tr[aria-selected=true]{background:#688ec51c}.pages,.plot-heading{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:8px 0}.muted{color:var(--color-text-secondary,GrayText);font-size:12px}#status{min-height:20px;margin:0 0 12px;white-space:pre-wrap;overflow-wrap:anywhere}#status[data-error=true]{color:#b64a35}#plot{height:540px;min-width:0}#conditions{white-space:pre-wrap;overflow-wrap:anywhere;font:12px ui-monospace,monospace;margin:10px 0}#details{font-size:12px;margin-bottom:8px}.ask{display:grid;gap:8px}.ask button{justify-self:end}[hidden]{display:none!important}
    @media(max-width:720px){body{padding:12px}.columns{grid-template-columns:1fr}.sidebar{grid-template-columns:1fr 1fr}.sidebar form{grid-column:1/-1}#plot{height:470px}}
  </style>
  <!-- plot-assets -->
</head>
<body>
  <header><div><h1>Result Store</h1><p>保存した結果を選んで、図を見ながら質問できます。</p></div><button id="refresh">更新</button></header>
  <p id="status" role="status" aria-live="polite">接続中…</p>
  <div class="columns">
    <aside class="sidebar">
      <label>Scheme<select id="scheme" aria-label="Scheme"></select></label>
      <form id="query"><h2>条件で絞り込む</h2><div id="filters"></div><button id="search" type="button" style="margin-top:14px">検索</button></form>
    </aside>
    <main>
      <section class="panel"><h2>保存結果</h2><div class="table-wrap"><table><thead id="head"></thead><tbody id="rows"></tbody></table></div><div class="pages"><button id="previous" disabled>前へ</button><span id="page" class="muted"></span><button id="next" disabled>次へ</button></div></section>
      <section class="panel"><div class="plot-heading"><h2>Plot</h2><select id="plot-choice" aria-label="Plot" disabled></select></div><div id="conditions" class="muted">結果を選択してください。</div><div id="details" class="muted"></div><div id="plot"></div></section>
      <section class="panel ask"><label>この結果への質問<textarea id="question" rows="2" placeholder="この結果の特徴を説明して"></textarea></label><button id="ask" disabled>この結果について質問</button></section>
    </main>
  </div>
  <script>/* app-script */</script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>MatlabResults</title>
  <style>
    :root{color-scheme:light dark;font:14px system-ui,sans-serif;background:var(--color-background-primary,Canvas);color:var(--color-text-primary,CanvasText)}
    *{box-sizing:border-box}body{margin:0;padding:12px;height:100dvh;display:flex;flex-direction:column;gap:10px;overflow:hidden}h2{font-size:14px;margin:0}header{display:flex;align-items:center;gap:8px;flex-wrap:wrap;flex-shrink:0}header label{display:flex;align-items:center;gap:8px;flex:1 1 230px;min-width:0}header select{flex:1}.directory-control{display:flex;align-items:center;gap:6px;flex:1 1 300px;min-width:0}.directory-control label{font-size:12px}.directory-control input{font-size:12px}.directory-control button{font-size:12px;white-space:nowrap}
    button,input,select,textarea{font:inherit;color:inherit;background:color-mix(in srgb,currentColor 6%,transparent);border:0;border-radius:6px;padding:6px 8px;min-width:0}button{cursor:pointer;background:transparent}button:disabled{cursor:default;opacity:.45}button:hover:enabled{background:color-mix(in srgb,currentColor 10%,transparent)}input:not([type=checkbox]),textarea,select{width:100%}textarea{resize:none}label{display:grid;gap:5px}select{max-width:100%}option{background:var(--color-background-primary,Canvas);color:var(--color-text-primary,CanvasText)}button,input,select,textarea{outline-offset:2px}:focus-visible{outline:2px solid var(--color-border-focus,#688ec5)}:focus:not(:focus-visible){outline:none}.icon{width:18px;height:18px;display:block;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.icon-button{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;padding:6px}.header-icon{display:inline-flex;flex-shrink:0}
    .columns{display:grid;grid-template-columns:290px minmax(0,1fr);gap:12px;flex:1;min-height:0}.sidebar{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:12px;padding-right:3px}.panel{min-width:0;min-height:0;border:1px solid var(--color-border-secondary,#aaa4);border-radius:9px;padding:10px}.toolbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.toolbar h2{margin-right:auto}.query-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 27px;gap:5px;padding:9px 0;border-bottom:1px solid #8883}.query-row select{font-size:12px}.query-editor{grid-column:1/-1;min-width:0}.current{display:block;border:1px solid #8885;border-radius:5px;padding:6px;text-align:center;overflow-wrap:anywhere;font-size:12px}.parameter{padding:10px 0;border-bottom:1px solid #8883;display:grid;grid-template-columns:95px minmax(0,1fr);align-items:center;gap:8px}.parameter>label{font-size:12px;overflow-wrap:anywhere}.editor{min-width:0}.bounds{display:grid;grid-template-columns:1fr 1fr;gap:5px}.slider-row{display:grid;grid-template-columns:27px minmax(0,1fr) 27px;gap:5px;align-items:center}.slider-row button{padding:4px}.slider-inputs{display:grid;gap:0}input[type=range]{padding:0;accent-color:#5076b7}.ticks{display:flex;justify-content:space-between;font-size:10px;overflow-wrap:anywhere}.picker{min-width:0}.picker-pages{display:flex;gap:5px;align-items:center;margin-bottom:5px}.picker-pages button{padding:2px 7px}.picker-pages span{font-size:11px;margin-right:auto}.check{display:flex;align-items:center;gap:5px;font-size:12px}.choices{display:grid;gap:4px;overflow:auto;max-height:150px;border:1px solid #8884;border-radius:5px;padding:5px}.choice{display:flex;gap:6px;align-items:center;overflow-wrap:anywhere;font-size:12px}.choice input{flex-shrink:0}
    main{display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0;overflow:auto}.plot-panel{display:grid;grid-template-rows:auto minmax(0,1fr);gap:5px;flex:0 0 max(360px,calc(73% - 5px))}.plot-heading{display:flex;align-items:center;gap:6px}.plot-heading h2{margin-right:auto}.plot-heading select{width:auto;max-width:40%;font-size:12px;flex:0 1 auto}#plot{min-width:0;min-height:0;width:100%;height:100%}.table-panel{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:6px;flex:0 0 max(160px,calc(27% - 5px))}main.table-hidden .plot-panel{flex-basis:calc(100% - 65px)}main.table-hidden .table-panel{flex:0 0 auto}.table-wrap{overflow:auto;min-height:0}table{border-collapse:collapse;width:100%;font-size:12px}th,td{text-align:left;border-bottom:1px solid #8883;padding:6px;white-space:nowrap}th{position:sticky;top:0;background:var(--color-background-primary,Canvas)}tbody tr{cursor:pointer}tr[aria-selected=true]{background:#688ec52b}tbody tr:hover{background:#688ec51c}#sort{width:auto;max-width:40%;font-size:12px}.pages{display:flex;align-items:center;justify-content:space-between;gap:8px}.muted{color:var(--color-text-secondary,GrayText);font-size:12px}#status{flex:0 1 auto;min-width:0;max-width:40%;margin:0;white-space:nowrap;font-size:12px;overflow:hidden;text-overflow:ellipsis}#status:empty{display:none}#status[data-error=true]{color:#b64a35}[hidden]{display:none!important}
    .sidebar>*{flex-shrink:0}.table-panel .toolbar button,.table-panel .toolbar select,.pages button{font-size:12px;padding:4px 7px}.table-wrap{scroll-padding-top:30px}.choice input[type=radio]{width:auto}.plot-heading button{font-size:12px;white-space:nowrap;flex-shrink:0}
    #pins-panel{flex:0 0 auto}#pins{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr));gap:10px;margin-top:8px}.pin-card{min-width:0;border:1px solid var(--color-border-secondary,#aaa4);border-radius:6px;padding:8px}.pin-heading{display:flex;align-items:center;gap:6px}.pin-heading h3{font-size:12px;font-weight:600;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0}.pin-heading button{padding:2px 7px}.pin-directory{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin:4px 0 0;font-size:10px}.pin-plot{height:400px;width:100%;min-width:0}
    #status{position:fixed;right:12px;bottom:8px;z-index:20;max-width:min(80%,620px);padding:4px 6px;border:1px solid var(--color-border-secondary,#aaa4);border-radius:5px;background:var(--color-background-primary,Canvas);pointer-events:none}
    #status[data-error=true]{pointer-events:auto;white-space:normal;overflow-wrap:anywhere}
    .query-item{position:relative;overflow:hidden;border-radius:6px}.query-item.swiping{background:#b33a39;color:#fff}.query-item.swiping::before,.query-item.swiping::after{content:'削除';position:absolute;top:50%;transform:translateY(-50%);font-size:12px}.query-item::before{left:12px}.query-item::after{right:12px}.query-row{position:relative;grid-template-columns:12px minmax(0,1fr) minmax(0,1.2fr) minmax(0,1.8fr);align-items:center;background:var(--color-background-primary,Canvas);color:var(--color-text-primary,CanvasText);transition:transform .15s}.query-row.swiping{transition:none;user-select:none}.query-swipe{display:flex;align-items:center;justify-content:center;align-self:stretch;cursor:grab;touch-action:pan-y;color:var(--color-text-secondary,GrayText)}.query-swipe .icon{width:12px;height:18px}.query-row input,.query-row button{font-size:12px}.query-row>select{padding:6px 4px}.query-row>.query-editor{grid-column:auto}.query-editor button{width:100%;background:color-mix(in srgb,currentColor 6%,transparent)}.query-editor button,.current{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.query-row .current{border:0;background:color-mix(in srgb,currentColor 6%,transparent)}
    .inline-parameter{display:grid;grid-template-columns:minmax(0,1fr) 7ch;gap:5px;align-items:center}.inline-parameter .current{border:0;padding:0;width:100%;max-width:none;text-align:right;font-variant-numeric:tabular-nums}.inline-parameter .ticks{display:none}.inline-parameter .slider-row{grid-template-columns:22px minmax(0,1fr) 22px;gap:3px}.inline-parameter .slider-row button{padding:3px 0}
    #picker-popover{color:inherit;background:var(--color-background-primary,Canvas);border:1px solid var(--color-border-secondary,#aaa6);border-radius:6px;padding:8px;margin:0;inset:auto;max-height:min(320px,calc(100dvh - 16px));overflow:auto;box-shadow:0 4px 16px #0003}#picker-popover h2{font-size:12px;margin-bottom:6px}#picker-popover .actions{display:flex;justify-content:flex-end;gap:6px;margin-top:8px}#picker-popover button{font-size:12px}
    .plot-heading{flex-wrap:wrap}#plot-theme{width:30px;flex:0 0 30px}#plot-title{display:flex;align-items:center;gap:6px}.plot-spinner{width:14px;height:14px;visibility:hidden;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}#plot-title.loading .plot-spinner{visibility:visible;animation:spin .8s linear infinite}.icon-button[aria-busy=true]{opacity:1;cursor:progress}.icon-button[aria-busy=true] .icon{animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){#plot-title.loading .plot-spinner,.icon-button[aria-busy=true] .icon{animation-duration:2s}.query-row{transition:none}}th{padding:0}th button{font-size:inherit;font-weight:600;text-align:left;width:100%;padding:6px;border-radius:0}
    .query-function-control{min-width:0}.query-function{display:flex;align-items:center;justify-content:space-between;gap:3px;width:100%;padding:6px 4px;background:color-mix(in srgb,currentColor 6%,transparent)}.query-function span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.query-function::after{content:'⌄';flex-shrink:0}.query-functions{position:fixed;margin:0;inset:auto;padding:6px;border:0;border-radius:8px;background:var(--color-background-primary,Canvas);color:var(--color-text-primary,CanvasText);box-shadow:0 4px 20px #0004;max-height:calc(100dvh - 16px);overflow:auto}.query-function-options{display:grid;max-height:min(260px,50dvh);overflow:auto}.query-function-options button{font-size:12px;text-align:left;padding:6px 8px;white-space:nowrap}.query-function-options [aria-selected=true]{background:color-mix(in srgb,currentColor 10%,transparent)}.query-function-hint{font-size:12px;line-height:1.5;min-height:4.5em;max-width:100%;white-space:normal;overflow-wrap:anywhere;margin:6px 4px 2px;color:var(--color-text-secondary,GrayText)}
    #ref-scheme{font-size:12px;margin-top:6px}.path-panel{flex:0 0 auto}.path-heading{display:flex;align-items:center;gap:6px}.path-heading h2{flex-shrink:0}.path-heading>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}.path-controls{display:grid;grid-template-columns:27px minmax(0,1fr) 27px;gap:5px;align-items:center;margin-top:5px}.path-controls button{padding:4px;width:27px;height:27px}.path-current{display:flex;gap:8px;font-size:12px;margin-top:4px;min-width:0}.path-current>span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}.path-current output{font-variant-numeric:tabular-nums;white-space:nowrap}.path-filters{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}.path-filters label{font-size:12px}.path-filters input{font-size:12px}#path-termination{margin-top:4px;overflow-wrap:anywhere}#path-termination:empty{display:none}
    .result-views{display:flex;gap:2px}.result-views button[aria-pressed=true]{background:color-mix(in srgb,currentColor 12%,transparent)}.table-panel.graph-view{flex-basis:max(300px,45%)}#result-graph{position:relative;min-height:0;overflow:hidden}.graph-footer{display:flex;align-items:center;gap:6px}.graph-footer span{margin-right:auto}.path-current{flex-wrap:wrap}.path-current output{margin-left:auto}
    @media(max-width:760px),(orientation:portrait){body{height:auto;min-height:100dvh;overflow:auto}.columns{grid-template-columns:1fr;flex:none}.sidebar{overflow:visible;padding:0}.parameter{grid-template-columns:120px minmax(0,1fr)}main{overflow:visible}.plot-panel,main.table-hidden .plot-panel{flex:0 0 440px;height:440px}.table-panel{flex:0 0 210px;height:210px}main.table-hidden .table-panel{flex:0 0 auto;height:auto}#pins{grid-template-columns:1fr}}
    @media(max-height:560px) and (min-width:761px){body{height:600px;overflow:auto}}
  </style>
  <!-- plot-assets -->
</head>
<body>
  <header><label class="directory-control"><span class="header-icon" data-icon="folder" aria-hidden="true" title="保存先ディレクトリ"></span><input id="directory" aria-label="Directory" list="directories" spellcheck="false"></label><datalist id="directories"></datalist><label><span class="header-icon" data-icon="scheme" aria-hidden="true" title="Scheme"></span><select id="scheme" aria-label="Scheme"></select></label><p id="status" role="status" aria-live="polite">接続中…</p><button id="refresh" class="icon-button" data-icon="refresh" aria-label="更新" title="更新"></button></header>
  <div class="columns">
    <aside class="sidebar">
      <section class="panel"><div class="toolbar"><h2>Query</h2><button id="add-query">＋ Query</button><button id="clear-query">クリア</button></div><div id="filters"></div></section>
      <section class="panel" id="ref-panel" hidden><div class="toolbar"><h2>初期値 RefQuery</h2><button id="add-ref-query" class="icon-button" data-icon="add" aria-label="子Queryを追加" title="子Queryを追加" disabled></button></div><select id="ref-scheme" aria-label="初期値RefのScheme"><option value="">指定なし</option></select><div id="ref-filters"></div></section>
      <section class="panel" id="parameters-panel"><h2>Parameters</h2><div id="parameters"></div></section>
      <section class="panel path-panel" id="path-panel" hidden>
        <div class="path-heading"><h2>Ref</h2><span id="path-terminal" class="muted"></span><button id="path-bounds" class="icon-button" data-icon="filter" aria-label="Pathの範囲条件" title="Pathの範囲条件" aria-expanded="false" aria-controls="path-filters"></button></div>
        <div id="path-filters" class="path-filters" hidden><label>順序<div class="bounds"><input id="path-sequence-min" type="number" min="1" step="1" placeholder="下限" aria-label="Path順序の下限"><input id="path-sequence-max" type="number" min="1" step="1" placeholder="上限" aria-label="Path順序の上限"></div></label><label>累積cycle<div class="bounds"><input id="path-cycle-min" type="number" min="0" step="any" placeholder="下限" aria-label="累積cycleの下限"><input id="path-cycle-max" type="number" min="0" step="any" placeholder="上限" aria-label="累積cycleの上限"></div></label></div>
        <div class="path-controls"><button id="path-previous" class="icon-button" data-icon="previous" aria-label="前の保存結果" title="前の保存結果"></button><input id="path-slider" type="range" min="0" max="1" value="0" step="1" aria-label="選んだ終端結果のPath"><button id="path-next" class="icon-button" data-icon="next" aria-label="次の保存結果" title="次の保存結果"></button></div>
        <div class="path-current"><span id="path-node"></span><output id="path-position"></output></div><div id="path-termination" class="muted"></div>
      </section>
    </aside>
    <main id="main">
      <section class="panel plot-panel"><div class="plot-heading"><h2 id="plot-title">Plot<svg class="plot-spinner" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a9 9 0 1 1-9 9"/></svg></h2><span id="matches" class="muted"></span><select id="plot-choice" aria-label="Plot" disabled></select><button id="plot-theme" class="icon-button" data-icon="auto" aria-label="Plotテーマ: アプリに追従。クリックで切り替え" title="Plotテーマ: アプリに追従。クリックで切り替え"></button><button id="copy-plot" class="icon-button" data-icon="copy" aria-label="Plotをコピー" title="SVG形式でコピー（PowerPoint用、PNGも同梱）" disabled></button><button id="pin-plot" class="icon-button" data-icon="pin" aria-label="表示中のPlotをピン留め" title="表示中のPlotをピン留め" disabled></button><button id="add-context" class="icon-button" data-icon="context" aria-label="コンテキストに追加" title="コンテキストに追加" disabled></button></div><div id="plot" aria-busy="false"></div></section>
      <section class="panel table-panel" id="results-panel"><div class="toolbar"><h2>保存結果 <span class="muted">Fixed</span></h2><div class="result-views" role="group" aria-label="保存結果の表示"><button id="view-table" aria-pressed="true">Table</button><button id="view-graph" aria-pressed="false">Graph</button></div><select id="sort" aria-label="並べ替え"></select><button id="direction" aria-label="並び順">↑</button><button id="toggle-table">Tableを隠す</button></div><div class="table-wrap" id="table-wrap"><table><thead id="head"></thead><tbody id="rows"></tbody></table></div><div id="result-graph" hidden></div><div class="pages" id="pages"><button id="previous" disabled>前へ</button><span id="page" class="muted"></span><button id="next" disabled>次へ</button></div><div class="graph-footer" id="graph-footer" hidden><span id="graph-count" class="muted"></span><button id="graph-zoom-out" class="icon-button" data-icon="zoomOut" aria-label="Graphを縮小" title="Graphを縮小"></button><button id="graph-zoom-in" class="icon-button" data-icon="zoomIn" aria-label="Graphを拡大" title="Graphを拡大"></button><button id="graph-fit" class="icon-button" data-icon="fit" aria-label="Graph全体を表示" title="Graph全体を表示"></button></div></section>
      <section class="panel" id="pins-panel" hidden><div class="toolbar"><h2>Pinned Canvas <span id="pins-count" class="muted"></span></h2></div><div id="pins"></div></section>
    </main>
  </div>
  <div id="picker-popover" popover="auto" role="dialog" aria-labelledby="picker-title"><h2 id="picker-title"></h2><div id="picker-body"></div><div class="actions"><button id="picker-cancel">キャンセル</button><button id="picker-apply">適用</button></div></div>
  <script>/* app-script */</script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Result Store</title>
  <style>
    :root{color-scheme:light dark;font:14px system-ui,sans-serif;background:var(--color-background-primary,Canvas);color:var(--color-text-primary,CanvasText)}
    *{box-sizing:border-box}body{margin:0;padding:12px;height:100dvh;display:flex;flex-direction:column;gap:10px;overflow:hidden}h2{font-size:14px;margin:0}header{display:flex;align-items:center;gap:8px;flex-shrink:0}header label{display:flex;align-items:center;gap:8px;flex:1;min-width:0}header select{flex:1}
    button,input,select,textarea{font:inherit;color:inherit;background:var(--color-background-primary,Canvas);border:1px solid var(--color-border-secondary,#aaa6);border-radius:6px;padding:6px 8px;min-width:0}button{cursor:pointer}button:disabled{cursor:default;opacity:.45}button:hover:enabled{background:var(--color-background-secondary,#8881)}input:not([type=checkbox]),textarea,select{width:100%}textarea{resize:none}label{display:grid;gap:5px}select{max-width:100%}button,input,select,textarea{outline-offset:2px}
    .columns{display:grid;grid-template-columns:290px minmax(0,1fr);gap:12px;flex:1;min-height:0}.sidebar{min-height:0;overflow:auto;display:flex;flex-direction:column;gap:12px;padding-right:3px}.panel{min-width:0;min-height:0;border:1px solid var(--color-border-secondary,#aaa4);border-radius:9px;padding:10px}.toolbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.toolbar h2{margin-right:auto}.query-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 27px;gap:5px;padding:9px 0;border-bottom:1px solid #8883}.query-row select{font-size:12px}.query-editor{grid-column:1/-1;min-width:0}.current{display:block;border:1px solid #8885;border-radius:5px;padding:6px;text-align:center;overflow-wrap:anywhere;font-size:12px}.parameter{padding:10px 0;border-bottom:1px solid #8883;display:grid;grid-template-columns:95px minmax(0,1fr);align-items:center;gap:8px}.parameter>label{font-size:12px;overflow-wrap:anywhere}.editor{min-width:0}.bounds{display:grid;grid-template-columns:1fr 1fr;gap:5px}.slider-row{display:grid;grid-template-columns:27px minmax(0,1fr) 27px;gap:5px;align-items:center}.slider-row button{padding:4px}.slider-inputs{display:grid;gap:0}input[type=range]{padding:0;accent-color:#5076b7}.ticks{display:flex;justify-content:space-between;font-size:10px;overflow-wrap:anywhere}.picker{min-width:0}.picker-pages{display:flex;gap:5px;align-items:center;margin-bottom:5px}.picker-pages button{padding:2px 7px}.picker-pages span{font-size:11px;margin-right:auto}.check{display:flex;align-items:center;gap:5px;font-size:12px}.choices{display:grid;gap:4px;overflow:auto;max-height:150px;border:1px solid #8884;border-radius:5px;padding:5px}.choice{display:flex;gap:6px;align-items:center;overflow-wrap:anywhere;font-size:12px}.choice input{flex-shrink:0}
    main{display:grid;grid-template-rows:minmax(0,1fr) minmax(115px,26%) auto;gap:10px;min-height:0;min-width:0}main.table-hidden{grid-template-rows:minmax(0,1fr) auto auto}.plot-panel{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:5px}.plot-heading{display:flex;align-items:center;gap:8px}.plot-heading h2{margin-right:auto}.plot-heading select{width:auto;max-width:55%;font-size:12px}#plot{min-width:0;min-height:0;width:100%;height:100%}.selection-details{font-size:11px;overflow:auto;max-height:100px}.selection-details summary{cursor:pointer;overflow-wrap:anywhere}#details{white-space:pre-wrap;overflow-wrap:anywhere;margin-top:6px}.table-panel{display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:6px}.table-wrap{overflow:auto;min-height:0}table{border-collapse:collapse;width:100%;font-size:12px}th,td{text-align:left;border-bottom:1px solid #8883;padding:6px;white-space:nowrap}th{position:sticky;top:0;background:var(--color-background-primary,Canvas)}tbody tr{cursor:pointer}tr[aria-selected=true]{background:#688ec52b}tbody tr:hover{background:#688ec51c}#sort{width:auto;max-width:40%;font-size:12px}.pages{display:flex;align-items:center;justify-content:space-between;gap:8px}.muted{color:var(--color-text-secondary,GrayText);font-size:12px}#status{flex-shrink:0;margin:0;white-space:pre-wrap;overflow-wrap:anywhere;font-size:12px;max-height:60px;overflow:auto}#status:empty{display:none}#status[data-error=true]{color:#b64a35}.ask{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:end}.ask label{font-size:12px}.ask button{font-size:12px}dialog{color:inherit;background:var(--color-background-primary,Canvas);border:1px solid #8886;border-radius:10px;padding:16px;width:min(480px,90vw);max-height:85dvh}dialog::backdrop{background:#0005}dialog .choices{max-height:50dvh}dialog h2{margin-bottom:12px}dialog .actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}[hidden]{display:none!important}
    .sidebar>*{flex-shrink:0}main{grid-template-rows:minmax(0,1fr) minmax(160px,27%) auto}.table-panel .toolbar button,.table-panel .toolbar select,.pages button{font-size:12px;padding:4px 7px}.table-wrap{scroll-padding-top:30px}.choice input[type=radio]{width:auto}
    .query-row{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr) minmax(0,1.8fr) 27px;align-items:center}.query-row input,.query-row button{font-size:12px}.query-row>select{padding:6px 4px}.query-row>button{padding:6px 0}.query-row>.query-editor{grid-column:auto}.query-editor button{width:100%}.query-editor button,.current{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    @media(max-width:760px){body{height:auto;min-height:100dvh;overflow:auto}.columns{grid-template-columns:1fr;flex:none}.sidebar{overflow:visible;padding:0}.parameter{grid-template-columns:120px minmax(0,1fr)}main{grid-template-rows:440px 210px auto}main.table-hidden{grid-template-rows:440px auto auto}.ask{grid-template-columns:1fr}.ask button{justify-self:end}}
    @media(max-height:560px) and (min-width:761px){body{height:600px;overflow:auto}}
  </style>
  <!-- plot-assets -->
</head>
<body>
  <header><label>Scheme<select id="scheme" aria-label="Scheme"></select></label><button id="refresh">更新</button></header>
  <p id="status" role="status" aria-live="polite">接続中…</p>
  <div class="columns">
    <aside class="sidebar">
      <section class="panel"><div class="toolbar"><h2>Query</h2><button id="add-query">＋ Query</button><button id="clear-query">クリア</button></div><div id="filters"></div></section>
      <section class="panel"><h2>Parameters</h2><div id="parameters"></div></section>
    </aside>
    <main id="main">
      <section class="panel plot-panel"><div class="plot-heading"><h2>Plot</h2><span id="matches" class="muted"></span><select id="plot-choice" aria-label="Plot" disabled></select></div><div id="plot"></div><details class="selection-details"><summary id="conditions">結果を選択してください。</summary><div id="details" class="muted"></div></details></section>
      <section class="panel table-panel"><div class="toolbar"><h2>保存結果 <span class="muted">Fixed</span></h2><select id="sort" aria-label="並べ替え"></select><button id="direction" aria-label="並び順">↑</button><button id="toggle-table">Tableを隠す</button></div><div class="table-wrap" id="table-wrap"><table><thead id="head"></thead><tbody id="rows"></tbody></table></div><div class="pages" id="pages"><button id="previous" disabled>前へ</button><span id="page" class="muted"></span><button id="next" disabled>次へ</button></div></section>
      <section class="panel ask"><label>この結果への質問<textarea id="question" rows="1" placeholder="この結果の特徴を説明して"></textarea></label><button id="ask" disabled>この結果について質問</button></section>
    </main>
  </div>
  <dialog id="picker-dialog"><h2 id="picker-title"></h2><div id="picker-body"></div><div class="actions"><button id="picker-cancel">キャンセル</button><button id="picker-apply">適用</button></div></dialog>
  <script>/* app-script */</script>
</body>
</html>
